<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeLab Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        /* ── Reset & Variables ───────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #090c10;
            --bg2: #0d1117;
            --surface: #111820;
            --surface2: #16202c;
            --border: #1e2d3d;
            --border2: #243447;
            --text: #cdd9e5;
            --muted: #5c7591;
            --accent: #39d353;
            --accent2: #58a6ff;
            --warn: #e3b341;
            --danger: #f85149;
            --cyan: #56d4dd;
            --purple: #bc8cff;
            --font-mono: 'JetBrains Mono', monospace;
            --font-ui: 'Space Grotesk', sans-serif;
            --radius: 6px;
            --card-pad: 20px;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
        }

        /* ── Scanline texture overlay ───────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, .15) 2px, rgba(0, 0, 0, .15) 4px);
            pointer-events: none;
            z-index: 9999;
            opacity: .35;
        }

        /* ── Layout ─────────────────────────────────────── */
        .layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Header ─────────────────────────────────────── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 16px rgba(57, 211, 83, .4);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 16px rgba(57, 211, 83, .4);
            }

            50% {
                box-shadow: 0 0 28px rgba(57, 211, 83, .8);
            }
        }

        .logo-icon svg {
            width: 18px;
            height: 18px;
            fill: #000;
        }

        .logo h1 {
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .1em;
        }

        .logo h1 span {
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #statusDot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        #statusDot.offline {
            background: var(--danger);
            box-shadow: 0 0 8px var(--danger);
        }

        #lastUpdated {
            font-family: var(--font-mono);
            font-size: .72rem;
            color: var(--muted);
        }

        #apiInput {
            background: var(--surface);
            border: 1px solid var(--border2);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: .78rem;
            padding: 6px 12px;
            border-radius: var(--radius);
            width: 240px;
            outline: none;
            transition: border-color .2s;
        }

        #apiInput:focus {
            border-color: var(--accent2);
        }

        #refreshBtn {
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: .78rem;
            padding: 6px 14px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all .2s;
        }

        #refreshBtn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* ── Main grid ───────────────────────────────────── */
        main {
            flex: 1;
            padding: 24px 28px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            align-items: start;
        }

        /* ── Card ────────────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--card-pad);
            position: relative;
            overflow: hidden;
            animation: fadeUp .4s ease both;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
        }

        .card.green::before {
            background: var(--accent);
        }

        .card.blue::before {
            background: var(--accent2);
        }

        .card.yellow::before {
            background: var(--warn);
        }

        .card.red::before {
            background: var(--danger);
        }

        .card.cyan::before {
            background: var(--cyan);
        }

        .card.purple::before {
            background: var(--purple);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-title {
            font-family: var(--font-mono);
            font-size: .7rem;
            font-weight: 500;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title svg {
            width: 14px;
            height: 14px;
        }

        .badge {
            font-family: var(--font-mono);
            font-size: .65rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        .badge.ok {
            background: rgba(57, 211, 83, .12);
            color: var(--accent);
            border: 1px solid rgba(57, 211, 83, .3);
        }

        .badge.warn {
            background: rgba(227, 179, 65, .12);
            color: var(--warn);
            border: 1px solid rgba(227, 179, 65, .3);
        }

        .badge.danger {
            background: rgba(248, 81, 73, .12);
            color: var(--danger);
            border: 1px solid rgba(248, 81, 73, .3);
        }

        .badge.nil {
            background: rgba(92, 117, 145, .12);
            color: var(--muted);
            border: 1px solid rgba(92, 117, 145, .3);
        }

        /* ── Stat rows ───────────────────────────────────── */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
            font-size: .88rem;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--muted);
            font-size: .8rem;
        }

        .stat-val {
            font-family: var(--font-mono);
            font-size: .85rem;
            color: var(--text);
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }

        .stat-val.accent {
            color: var(--accent);
        }

        .stat-val.blue {
            color: var(--accent2);
        }

        .stat-val.yellow {
            color: var(--warn);
        }

        .stat-val.danger {
            color: var(--danger);
        }

        .stat-val.cyan {
            color: var(--cyan);
        }

        .stat-val.purple {
            color: var(--purple);
        }

        .stat-val.nil {
            color: var(--muted);
            font-style: italic;
        }

        /* ── Progress bar ────────────────────────────────── */
        .bar-wrap {
            margin: 10px 0 4px;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: .75rem;
            color: var(--muted);
            margin-bottom: 5px;
            font-family: var(--font-mono);
        }

        .bar-track {
            height: 5px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .6s cubic-bezier(.23, 1, .32, 1);
        }

        .bar-fill.green {
            background: var(--accent);
            box-shadow: 0 0 6px rgba(57, 211, 83, .5);
        }

        .bar-fill.blue {
            background: var(--accent2);
            box-shadow: 0 0 6px rgba(88, 166, 255, .5);
        }

        .bar-fill.yellow {
            background: var(--warn);
            box-shadow: 0 0 6px rgba(227, 179, 65, .5);
        }

        .bar-fill.red {
            background: var(--danger);
            box-shadow: 0 0 6px rgba(248, 81, 73, .5);
        }

        /* ── Big number ──────────────────────────────────── */
        .big-num {
            font-family: var(--font-mono);
            font-size: 2.6rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 4px;
        }

        .big-sub {
            font-size: .75rem;
            color: var(--muted);
        }

        /* ── Disk grid ───────────────────────────────────── */
        .disk-item {
            margin-bottom: 14px;
        }

        .disk-item:last-child {
            margin-bottom: 0;
        }

        .disk-path {
            font-family: var(--font-mono);
            font-size: .72rem;
            color: var(--accent2);
            margin-bottom: 4px;
        }

        .disk-meta {
            display: flex;
            justify-content: space-between;
            font-size: .75rem;
            color: var(--muted);
            margin-top: 3px;
            font-family: var(--font-mono);
        }

        /* ── Process table ───────────────────────────────── */
        .proc-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: .75rem;
        }

        .proc-table th {
            color: var(--muted);
            font-weight: 400;
            text-align: left;
            padding: 0 6px 8px;
            letter-spacing: .08em;
        }

        .proc-table td {
            padding: 5px 6px;
            border-top: 1px solid var(--border);
        }

        .proc-table tr:hover td {
            background: var(--surface2);
        }

        .proc-name {
            color: var(--accent2);
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .proc-cpu {
            color: var(--warn);
        }

        .proc-mem {
            color: var(--cyan);
        }

        /* ── Temp section ────────────────────────────────── */
        .temp-section {
            margin-bottom: 12px;
        }

        .temp-sensor-name {
            font-family: var(--font-mono);
            font-size: .68rem;
            color: var(--muted);
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        /* ── Fan row ─────────────────────────────────────── */
        .fan-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }

        .fan-row:last-child {
            border-bottom: none;
        }

        .fan-name {
            font-size: .8rem;
            color: var(--muted);
        }

        .fan-rpm {
            font-family: var(--font-mono);
            color: var(--cyan);
        }

        /* ── Battery ring ────────────────────────────────── */
        .bat-wrap {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bat-ring {
            position: relative;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .bat-ring svg {
            transform: rotate(-90deg);
        }

        .bat-ring-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 700;
        }

        .bat-details {
            flex: 1;
        }

        /* ── Nil card ────────────────────────────────────── */
        .nil-card-body {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            color: var(--muted);
            font-size: .82rem;
        }

        /* ── Network sparkline ───────────────────────────── */
        .net-speeds {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .net-speed-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            text-align: center;
        }

        .net-speed-val {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 700;
        }

        .net-speed-lbl {
            font-size: .68rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .1em;
            margin-top: 2px;
        }

        /* ── Loader ──────────────────────────────────────── */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 9998;
            transition: opacity .5s;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            font-family: var(--font-mono);
            font-size: .8rem;
            color: var(--muted);
            letter-spacing: .15em;
        }

        /* ── Error banner ────────────────────────────────── */
        #errorBanner {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 24px;
            background: rgba(248, 81, 73, .15);
            border: 1px solid var(--danger);
            color: var(--danger);
            font-family: var(--font-mono);
            font-size: .78rem;
            padding: 10px 16px;
            border-radius: var(--radius);
            z-index: 9999;
            max-width: 340px;
        }

        /* ── Full-width card ─────────────────────────────── */
        .span2 {
            grid-column: span 2;
        }

        @media (max-width: 700px) {
            .span2 {
                grid-column: span 1;
            }

            main {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
        <p class="loader-text">INITIALIZING MONITOR…</p>
    </div>

    <div id="errorBanner"></div>

    <div class="layout">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z" />
                    </svg>
                </div>
                <h1>HOME<span>LAB</span> MONITOR</h1>
            </div>
            <div class="header-right">
                <input id="apiInput" type="text" value="http://localhost:8000" placeholder="API base URL" />
                <button id="refreshBtn">⟳ REFRESH</button>
                <span id="statusDot" class="offline"></span>
                <span id="lastUpdated">—</span>
            </div>
        </header>

        <main id="grid">
            <!-- cards injected by JS -->
        </main>
    </div>

    <script>
        /* ─── Config ────────────────────────────────────────────────── */
        const REFRESH_MS = 5000;
        let apiBase = () => document.getElementById('apiInput').value.replace(/\/$/, '');

        /* ─── Utilities ─────────────────────────────────────────────── */
        const $ = id => document.getElementById(id);
        const fmtBytes = (b, decimals = 1) => {
            if (!b && b !== 0) return '—';
            const k = 1024, dm = decimals, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            if (b === 0) return '0 B';
            const i = Math.floor(Math.log(b) / Math.log(k));
            return parseFloat((b / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        };
        const colorPct = p => p >= 90 ? 'red' : p >= 70 ? 'yellow' : 'green';
        const barColor = p => p >= 90 ? 'red' : p >= 70 ? 'yellow' : p >= 50 ? 'blue' : 'green';

        function bar(label, pct, extra = '') {
            const c = barColor(pct);
            return `
    <div class="bar-wrap">
      <div class="bar-label"><span>${label}</span><span>${pct?.toFixed(1)}%${extra}</span></div>
      <div class="bar-track"><div class="bar-fill ${c}" style="width:${Math.min(pct, 100)}%"></div></div>
    </div>`;
        }

        function statRow(label, val, cls = '') {
            return `<div class="stat-row">
    <span class="stat-label">${label}</span>
    <span class="stat-val ${cls}">${val ?? '<span class="nil">—</span>'}</span>
  </div>`;
        }

        function nilCard(title, icon, reason = 'Not available on this device') {
            return `<div class="card cyan">
    <div class="card-header">
      <span class="card-title">${icon} ${title}</span>
      <span class="badge nil">NIL</span>
    </div>
    <div class="nil-card-body">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      ${reason}
    </div>
  </div>`;
        }

        /* ─── Card builders ─────────────────────────────────────────── */
        function sysCard(s) {
            return `<div class="card blue">
    <div class="card-header">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        System
      </span>
      <span class="badge ok">ONLINE</span>
    </div>
    ${statRow('Hostname', s.hostname, 'blue')}
    ${statRow('OS', `${s.os} ${s.os_release}`)}
    ${statRow('Arch', s.architecture)}
    ${statRow('IP', s.ip, 'accent')}
    ${statRow('MAC', s.mac || '—')}
    ${statRow('Uptime', s.uptime, 'yellow')}
    ${statRow('Boot', s.boot_time?.replace('T', ' '))}
  </div>`;
        }

        function cpuCard(c) {
            const cls = colorPct(c.percent);
            const perCore = (c.per_core || []).map((p, i) =>
                bar(`Core ${i}`, p)
            ).join('');
            return `<div class="card green">
    <div class="card-header">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
        CPU
      </span>
      <span class="badge ${cls === 'red' ? 'danger' : cls === 'yellow' ? 'warn' : 'ok'}">${c.percent?.toFixed(1)}%</span>
    </div>
    <div class="big-num" style="color:var(--accent)">${c.percent?.toFixed(1)}<span style="font-size:1rem">%</span></div>
    <div class="big-sub">${c.cores_physical} physical · ${c.cores_logical} logical · ${c.freq_mhz_current ?? '—'} MHz</div>
    ${bar('Total Load', c.percent)}
    <div style="margin-top:12px;max-height:180px;overflow-y:auto">${perCore}</div>
  </div>`;
        }

        function memCard(m) {
            return `<div class="card purple">
    <div class="card-header">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="14"/><line x1="10" y1="10" x2="10" y2="14"/><line x1="14" y1="10" x2="14" y2="14"/><line x1="18" y1="10" x2="18" y2="14"/></svg>
        Memory
      </span>
      <span class="badge ${colorPct(m.percent) === 'red' ? 'danger' : colorPct(m.percent) === 'yellow' ? 'warn' : 'ok'}">${m.percent?.toFixed(1)}%</span>
    </div>
    <div class="big-num" style="color:var(--purple)">${m.used_gb}<span style="font-size:1rem"> GB</span></div>
    <div class="big-sub">of ${m.total_gb} GB · ${m.available_gb} GB free</div>
    ${bar('RAM', m.percent)}
    ${bar('Swap', m.swap_percent, ` · ${m.swap_used_gb}/${m.swap_total_gb} GB`)}
  </div>`;
        }

        function diskCard(disks) {
            if (!disks || !disks.length) return nilCard('Storage', '💾', 'No mounted disks found');
            const items = disks.map(d => `
    <div class="disk-item">
      <div class="disk-path">${d.mountpoint} <span style="color:var(--muted);font-size:.65rem">${d.fstype}</span></div>
      ${bar(d.device, d.percent)}
      <div class="disk-meta"><span>${d.used_gb} GB used</span><span>${d.free_gb} GB free / ${d.total_gb} GB</span></div>
    </div>`).join('');
            return `<div class="card yellow">
    <div class="card-header">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        Storage
      </span>
      <span class="badge ok">${disks.length} disk${disks.length > 1 ? 's' : ''}</span>
    </div>
    ${items}
  </div>`;
        }

        function netCard(n) {
            return `<div class="card cyan">
    <div class="card-header">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
        Network
      </span>
    </div>
    <div class="net-speeds">
      <div class="net-speed-box">
        <div class="net-speed-val" style="color:var(--accent)">↓ ${n.rx_rate_kbps?.toFixed(1)}</div>
        <div class="net-speed-lbl">KB/s down</div>
      </div>
      <div class="net-speed-box">
        <div class="net-speed-val" style="color:var(--accent2)">↑ ${n.tx_rate_kbps?.toFixed(1)}</div>
        <div class="net-speed-lbl">KB/s up</div>
      </div>
    </div>
    ${statRow('Total Received', fmtBytes(n.bytes_recv_total), 'accent')}
    ${statRow('Total Sent', fmtBytes(n.bytes_sent_total), 'blue')}
    ${statRow('Pkts Recv', n.packets_recv?.toLocaleString())}
    ${statRow('Pkts Sent', n.packets_sent?.toLocaleString())}
    ${Object.entries(n.interfaces || {}).map(([k, v]) => statRow(k, v, 'cyan')).join('')}
  </div>`;
        }

        function tempCard(temps) {
            if (!temps) return nilCard('Temperatures', '🌡️', 'Thermal sensors not available on this device');
            const sections = Object.entries(temps).map(([name, sensors]) => {
                const rows = sensors.map(s => {
                    const c = s.current >= (s.critical ?? 999) ? 'danger' : s.current >= (s.high ?? 999) ? 'yellow' : 'accent';
                    return statRow(s.label, `${s.current?.toFixed(1)} °C`, c);
                }).join('');
                return `<div class="temp-section"><div class="temp-sensor-name">${name}</div>${rows}</div>`;
            }).join('');
            return `<div class="card red">
    <div class="card-header">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
        Temperatures
      </span>
    </div>
    ${sections}
  </div>`;
        }

        function fanCard(fans) {
            if (!fans) return nilCard('Fans', '🌀', 'Fan sensors not available on this device');
            const rows = fans.map(f => `
    <div class="fan-row">
      <span class="fan-name">${f.name}</span>
      <span class="fan-rpm">${f.rpm?.toLocaleString()} RPM</span>
    </div>`).join('');
            return `<div class="card cyan">
    <div class="card-header">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a9.96 9.96 0 0 1 6.29 2.23 10 10 0 0 1-2.23 16.54A10 10 0 0 1 2.26 9.7 10 10 0 0 1 12 2z"/><circle cx="12" cy="12" r="3"/></svg>
        Fans
      </span>
      <span class="badge ok">${fans.length}</span>
    </div>
    ${rows}
  </div>`;
        }

        function batteryCard(bat) {
            if (!bat) return nilCard('Battery', '🔋', 'No battery detected (desktop / server)');
            const pct = bat.percent;
            const col = pct < 20 ? '#f85149' : pct < 50 ? '#e3b341' : '#39d353';
            const r = 34, circ = 2 * Math.PI * r;
            const dash = circ * (pct / 100);
            const timeLeft = bat.time_left_secs
                ? `${Math.floor(bat.time_left_secs / 3600)}h ${Math.floor((bat.time_left_secs % 3600) / 60)}m remaining`
                : bat.plugged_in ? 'Charging / Full' : '—';
            return `<div class="card ${pct < 20 ? 'red' : pct < 50 ? 'yellow' : 'green'}">
    <div class="card-header">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="18" height="11" rx="2"/><path d="M20 11h2v4h-2"/></svg>
        Battery
      </span>
      <span class="badge ${pct < 20 ? 'danger' : pct < 50 ? 'warn' : 'ok'}">${bat.plugged_in ? '⚡ Charging' : 'On Battery'}</span>
    </div>
    <div class="bat-wrap">
      <div class="bat-ring">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--border2)" stroke-width="6"/>
          <circle cx="40" cy="40" r="${r}" fill="none" stroke="${col}" stroke-width="6"
            stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
            style="filter:drop-shadow(0 0 4px ${col})"/>
        </svg>
        <div class="bat-ring-label" style="color:${col}">${pct.toFixed(0)}%</div>
      </div>
      <div class="bat-details">
        ${statRow('Status', bat.plugged_in ? 'Plugged In' : 'Discharging', bat.plugged_in ? 'accent' : 'yellow')}
        ${statRow('Time Left', timeLeft)}
      </div>
    </div>
  </div>`;
        }

        function processCard(procs) {
            if (!procs?.length) return '';
            const rows = procs.slice(0, 8).map(p => `
    <tr>
      <td>${p.pid}</td>
      <td class="proc-name">${p.name}</td>
      <td class="proc-cpu">${(p.cpu_percent ?? 0).toFixed(1)}%</td>
      <td class="proc-mem">${(p.memory_percent ?? 0).toFixed(1)}%</td>
      <td style="color:var(--muted)">${p.status}</td>
    </tr>`).join('');
            return `<div class="card blue span2">
    <div class="card-header">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Top Processes
      </span>
      <span class="badge ok">${procs.length} tracked</span>
    </div>
    <table class="proc-table">
      <tr><th>PID</th><th>Name</th><th>CPU</th><th>MEM</th><th>Status</th></tr>
      ${rows}
    </table>
  </div>`;
        }

        /* ─── Render ─────────────────────────────────────────────────── */
        function render(data) {
            const grid = $('grid');
            grid.innerHTML = [
                sysCard(data.system),
                cpuCard(data.cpu),
                memCard(data.memory),
                diskCard(data.disks),
                netCard(data.network),
                tempCard(data.temperatures),
                fanCard(data.fans),
                batteryCard(data.battery),
                processCard(data.processes),
            ].join('');
        }

        /* ─── Fetch ──────────────────────────────────────────────────── */
        async function fetchStats() {
            const url = `${apiBase()}/stats`;
            try {
                const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                render(data);
                $('statusDot').className = '';
                $('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
                $('errorBanner').style.display = 'none';
                $('loader').classList.add('hidden');
            } catch (e) {
                $('statusDot').className = 'offline';
                const eb = $('errorBanner');
                eb.style.display = 'block';
                eb.textContent = `⚠ Cannot reach API at ${url} — ${e.message}`;
            }
        }

        /* ─── Boot ───────────────────────────────────────────────────── */
        $('refreshBtn').addEventListener('click', fetchStats);
        $('apiInput').addEventListener('keydown', e => e.key === 'Enter' && fetchStats());

        fetchStats();
        setInterval(fetchStats, REFRESH_MS);
    </script>
</body>

</html>

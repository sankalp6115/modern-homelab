name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - app: file_server
            has_frontend: true
            has_backend: true
          - app: home
            has_frontend: true
            has_backend: true
          - app: idea_inbox
            has_frontend: true
            has_backend: true
          - app: keybinder
            has_frontend: true
            has_backend: true
          - app: melodious
            has_frontend: true
            has_backend: true
          - app: monitor
            has_frontend: true
            has_backend: true
          - app: no-as-a-service
            has_frontend: false
            has_backend: true
          - app: paper_boy
            has_frontend: true
            has_backend: true
          - app: quote
            has_frontend: true
            has_backend: true
          - app: yt_downloader
            has_frontend: true
            has_backend: true

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Setup Node
        if: ${{ matrix.has_frontend == true }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        if: ${{ matrix.has_frontend == true }}
        working-directory: source/apps/${{ matrix.app }}/frontend
        run: |
          npm ci
          npm run build

      - name: Copy backend
        if: ${{ matrix.has_backend == true }}
        run: |
          mkdir -p deploy_output/backend
          cp -r source/apps/${{ matrix.app }}/backend/* deploy_output/backend/

      - name: Copy frontend dist
        if: ${{ matrix.has_frontend == true }}
        run: |
          mkdir -p deploy_output/frontend/dist
          cp -r source/apps/${{ matrix.app }}/frontend/dist/* deploy_output/frontend/dist/

      - name: Copy start script
        if: ${{ hashFiles(format('source/apps/{0}/start.sh', matrix.app)) != '' }}
        run: |
          cp source/apps/${{ matrix.app }}/start.sh deploy_output/start.sh

      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy
          path: deploy_repo
          fetch-depth: 0

      - name: Replace app folder in deploy branch
        run: |
          rm -rf deploy_repo/apps/${{ matrix.app }}
          mkdir -p deploy_repo/apps/${{ matrix.app }}
          cp -r deploy_output/* deploy_repo/apps/${{ matrix.app }}/

      - name: Commit and push
        working-directory: deploy_repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -d "apps/${{ matrix.app }}/frontend/dist" ]; then
            git add -f apps/${{ matrix.app }}/frontend/dist
          fi
          git add .
          git commit -m "Deploy ${{ matrix.app }}: ${{ github.sha }}" || echo "Nothing to commit"
          git push origin deploy
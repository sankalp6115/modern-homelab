<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keybinder Pro | Remote Gaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #a855f7;
        --bg: #0f172a;
        --glass: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background: var(--bg);
        color: white;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      }

      .container {
        position: relative;
        width: 100%;
        max-width: 500px;
        padding: 2rem;
        background: var(--glass);
        backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1rem;
        background: linear-gradient(to right, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.5rem 1rem;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 2rem;
        transition: all 0.3s ease;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 8px;
        background: #ef4444; /* disconnected */
        box-shadow: 0 0 10px #ef4444;
      }

      .connected .status-dot {
        background: #22c55e;
        box-shadow: 0 0 10px #22c55e;
      }

      .key-display {
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3.5rem;
        font-weight: 700;
        color: white;
        text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        margin: 1.5rem 0;
        transition: transform 0.1s ease;
      }

      .key-display.active {
        transform: scale(1.1);
        color: var(--primary);
      }

      .hint {
        color: #94a3b8;
        font-size: 0.875rem;
        line-height: 1.6;
      }

      .particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Keybinder Pro</h1>
      <div id="statusBadge" class="status-badge">
        <div class="status-dot"></div>
        <span id="statusText">Disconnected</span>
      </div>

      <div class="hint">Focus this window to start remote gaming</div>

      <div id="keyDisplay" class="key-display">Ready</div>

      <div class="hint">
        Keystrokes are sent in real-time via WebSockets.<br />
        Support for WASD, Arrows, Space, and more.
      </div>
    </div>

    <script>
      const statusBadge = document.getElementById("statusBadge");
      const statusText = document.getElementById("statusText");
      const keyDisplay = document.getElementById("keyDisplay");

      let socket = null;
      let reconnectTimer = null;

      function connect() {
        // Automatically detect host (assuming same origin)
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const host = "10.34.90.226";
        const wsUrl = `${protocol}//${host}:8000/ws`;

        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
          console.log("Connected to server");
          statusBadge.classList.add("connected");
          statusText.textContent = "Connected";
          clearInterval(reconnectTimer);
        };

        socket.onclose = () => {
          console.log("Disconnected from server");
          statusBadge.classList.remove("connected");
          statusText.textContent = "Disconnected - Retrying...";
          reconnectTimer = setInterval(() => {
            if (socket.readyState === WebSocket.CLOSED) connect();
          }, 2000);
        };

        socket.onerror = (err) => {
          console.error("WebSocket error:", err);
        };
      }

      function sendKeyEvent(action, key) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ action, key }));
        }
      }

      document.addEventListener("keydown", (e) => {
        // Prevent default browser shortcuts if needed, but be careful
        if (e.repeat) return; // Server handles repeat check too, but good to have here

        keyDisplay.textContent =
          e.code === "Space" ? "SPACE" : e.code.replace("Key", "");
        keyDisplay.classList.add("active");
        sendKeyEvent("keydown", e.code);
      });

      document.addEventListener("keyup", (e) => {
        keyDisplay.classList.remove("active");
        sendKeyEvent("keyup", e.code);
      });

      // Initialize connection
      connect();
    </script>
  </body>
</html>

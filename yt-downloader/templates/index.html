<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Downloader</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Space Grotesk",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: #ff90e8;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border: 4px solid #000;
        border-radius: 12px;
        box-shadow: 12px 12px 0 rgba(0, 0, 0, 1);
        max-width: 600px;
        width: 100%;
        padding: 40px;
      }

      h1 {
        color: #000;
        margin-bottom: 10px;
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -1px;
      }

      .subtitle {
        color: #000;
        margin-bottom: 30px;
        font-size: 16px;
        font-weight: 700;
      }

      .input-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #000;
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
      }

      input[type="text"] {
        width: 100%;
        padding: 14px 16px;
        border: 3px solid #000;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        background: #fff;
        color: #000;
        transition: all 0.2s ease;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 1);
      }

      input[type="text"]:focus {
        outline: none;
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0 rgba(0, 0, 0, 1);
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
      }

      select {
        width: 100%;
        padding: 14px 16px;
        border: 3px solid #000;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        background: #fff;
        color: #000;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 1);
        appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23000000%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 15px top 50%;
        background-size: 12px auto;
      }

      select:focus {
        outline: none;
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0 rgba(0, 0, 0, 1);
      }

      select:disabled {
        background-color: #e0e0e0;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      .btn {
        width: 100%;
        padding: 16px;
        border: 3px solid #000;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 900;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-bottom: 10px;
        box-shadow: 6px 6px 0 rgba(0, 0, 0, 1);
      }

      .btn-primary {
        background: #ffe600;
        color: #000;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translate(2px, 2px);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 1);
      }

      .btn-primary:active:not(:disabled) {
        transform: translate(6px, 6px);
        box-shadow: 0px 0px 0 rgba(0, 0, 0, 1);
      }

      .btn-success {
        background: #00e5ff;
        color: #000;
      }

      .btn-success:hover:not(:disabled) {
        transform: translate(2px, 2px);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 1);
      }

      .btn-success:active:not(:disabled) {
        transform: translate(6px, 6px);
        box-shadow: 0px 0px 0 rgba(0, 0, 0, 1);
      }

      .btn:disabled {
        opacity: 1;
        background: #e0e0e0;
        cursor: not-allowed;
        box-shadow: 0px 0px 0 rgba(0, 0, 0, 1);
        transform: translate(6px, 6px);
      }

      .info-box {
        background: #fff;
        border: 3px solid #000;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        box-shadow: 6px 6px 0 rgba(0, 0, 0, 1);
      }

      .info-box.show {
        display: block;
      }

      .info-box h3 {
        color: #000;
        font-size: 18px;
        font-weight: 900;
        margin-bottom: 12px;
      }

      .info-box p {
        color: #000;
        font-size: 15px;
        font-weight: 600;
        margin: 8px 0;
      }

      .alert {
        padding: 16px;
        border: 3px solid #000;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        font-weight: 800;
        box-shadow: 6px 6px 0 rgba(0, 0, 0, 1);
      }

      .alert.show {
        display: block;
      }

      .alert-error {
        background: #ff6b6b;
        color: #000;
      }

      .alert-success {
        background: #00e5ff;
        color: #000;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 20px;
      }

      .loading.show {
        display: block;
      }

      .spinner {
        border: 5px solid #000;
        border-top: 5px solid #ff90e8;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .hidden {
        display: none;
      }

      /* Queue Styles */
      .queue-section {
        margin-top: 30px;
        border-top: 4px solid #000;
        padding-top: 20px;
      }

      .queue-section h2 {
        font-size: 22px;
        font-weight: 900;
        text-transform: uppercase;
        margin-bottom: 15px;
      }

      .queue-item {
        background: #fff;
        border: 3px solid #000;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 1);
      }

      .queue-title {
        font-weight: 800;
        font-size: 16px;
        margin-bottom: 8px;
        color: #000;
        text-transform: uppercase;
        word-break: break-all;
      }

      .queue-status {
        font-weight: 800;
        font-size: 14px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      
      .status-queued { color: #888; }
      .status-downloading { color: #f39c12; }
      .status-completed { color: #27ae60; }
      .status-error { color: #c0392b; }

      .queue-progress-bar {
        width: 100%;
        height: 14px;
        background: #fff;
        border: 2px solid #000;
        border-radius: 6px;
        margin-bottom: 8px;
        overflow: hidden;
      }

      .queue-progress-fill {
        height: 100%;
        background: #00e5ff;
        width: 0%;
        transition: width 0.3s ease;
      }

      .queue-stats {
        font-size: 13px;
        font-weight: 700;
        display: flex;
        justify-content: space-between;
      }

      .btn-download-item {
        margin-top: 10px;
        padding: 12px;
        font-size: 14px;
        margin-bottom: 0;
        display: block;
        text-align: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>YouTube Downloader</h1>
      <p class="subtitle">Download videos and audio from YouTube</p>

      <div id="alertBox" class="alert"></div>

      <div class="input-group">
        <label for="url">YouTube URL</label>
        <input
          type="text"
          id="url"
          placeholder="https://www.youtube.com/watch?v=..."
          autocomplete="off"
        />
      </div>

      <button id="fetchBtn" class="btn btn-primary">Fetch Video Info</button>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>

      <div id="infoBox" class="info-box"></div>

      <div id="optionsSection" class="hidden">
        <div class="options-grid">
          <div class="input-group">
            <label for="mediaType">Media Type</label>
            <select id="mediaType">
              <option value="video">Video + Audio</option>
              <option value="audio">Audio Only</option>
            </select>
          </div>

          <div class="input-group">
            <label for="quality">Quality</label>
            <select id="quality">
              <option value="best">Best Available</option>
            </select>
          </div>
        </div>

        <button id="downloadBtn" class="btn btn-success">Download</button>
      </div>

      <div id="queueSection" class="queue-section hidden">
        <h2>Download Queue</h2>
        <div id="queueContainer"></div>
      </div>
    </div>

    <script>
      const urlInput = document.getElementById("url");
      const fetchBtn = document.getElementById("fetchBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const mediaTypeSelect = document.getElementById("mediaType");
      const qualitySelect = document.getElementById("quality");
      const infoBox = document.getElementById("infoBox");
      const optionsSection = document.getElementById("optionsSection");
      const loading = document.getElementById("loading");
      const alertBox = document.getElementById("alertBox");
      const queueSection = document.getElementById("queueSection");
      const queueContainer = document.getElementById("queueContainer");

      let videoInfo = null;
      let pollingInterval = null;

      function showAlert(message, type = "error") {
        alertBox.textContent = message;
        alertBox.className = `alert alert-${type} show`;
        setTimeout(() => {
          alertBox.classList.remove("show");
        }, 5000);
      }

      function showLoading(show) {
        loading.classList.toggle("show", show);
      }

      mediaTypeSelect.addEventListener("change", function () {
        if (this.value === "audio") {
          qualitySelect.innerHTML = '<option value="best">Best Audio</option>';
          qualitySelect.disabled = true;
        } else {
          populateQualityOptions();
          qualitySelect.disabled = false;
        }
      });

      function populateQualityOptions() {
        qualitySelect.innerHTML =
          '<option value="best">Best Available</option>';

        if (videoInfo && videoInfo.formats) {
          videoInfo.formats.forEach((format) => {
            const option = document.createElement("option");
            option.value = format.quality;
            option.textContent = `${format.quality} (${format.ext})`;
            qualitySelect.appendChild(option);
          });
        }
      }

      fetchBtn.addEventListener("click", async function () {
        const url = urlInput.value.trim();

        if (!url) {
          showAlert("Please enter a YouTube URL");
          return;
        }

        if (!url.includes("youtube.com") && !url.includes("youtu.be")) {
          showAlert("Please enter a valid YouTube URL");
          return;
        }

        showLoading(true);
        fetchBtn.disabled = true;
        infoBox.classList.remove("show");
        optionsSection.classList.add("hidden");

        try {
          const response = await fetch("/api/info", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ url }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Failed to fetch video info");
          }

          videoInfo = data;

          let infoHTML = `<h3>${data.title}</h3>`;

          if (data.type === "playlist") {
            infoHTML += `<p>📋 Playlist with ${data.video_count} videos</p>`;
          } else {
            const duration = Math.floor(data.duration / 60);
            infoHTML += `<p>⏱️ Duration: ${duration} minutes</p>`;
            infoHTML += `<p>🎥 ${data.formats.length} quality options available</p>`;
          }

          infoBox.innerHTML = infoHTML;
          infoBox.classList.add("show");
          optionsSection.classList.remove("hidden");

          populateQualityOptions();
        } catch (error) {
          showAlert(error.message);
        } finally {
          showLoading(false);
          fetchBtn.disabled = false;
        }
      });

      downloadBtn.addEventListener("click", async function () {
        const url = urlInput.value.trim();
        const quality = qualitySelect.value;
        const type = mediaTypeSelect.value;

        showLoading(true);
        downloadBtn.disabled = true;
        downloadBtn.textContent = "Adding to Queue...";

        try {
          const response = await fetch("/api/enqueue", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ url, quality, type }),
          });

          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.error || "Enqueue failed");
          }

          showAlert("Added to queue!", "success");
          
          // Reset view
          optionsSection.classList.add("hidden");
          infoBox.classList.remove("show");
          urlInput.value = "";
          
          // Show queue section
          queueSection.classList.remove("hidden");
          
          if (!pollingInterval) startPolling();

        } catch (error) {
          showAlert(error.message);
        } finally {
          showLoading(false);
          downloadBtn.disabled = false;
          downloadBtn.textContent = "Download";
        }
      });

      urlInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          fetchBtn.click();
        }
      });

      async function fetchQueue() {
          try {
              const res = await fetch('/api/queue');
              if (!res.ok) return;
              const data = await res.json();
              if (data.queue && data.queue.length > 0) {
                  queueSection.classList.remove("hidden");
                  renderQueue(data.queue);
                  if (!pollingInterval) startPolling();
              }
          } catch(e) {
              console.error(e);
          }
      }

      function renderQueue(queue) {
          if (queue.length === 0) {
              queueContainer.innerHTML = '<p>No active downloads.</p>';
              return;
          }
          
          // Render backwards to show newest at top
          let html = '';
          for (let i = queue.length - 1; i >= 0; i--) {
              const job = queue[i];
              const progressNum = parseFloat(job.progress) || 0;
              
              let statsHtml = '';
              let actionHtml = '';
              
              if (job.status === 'downloading') {
                  statsHtml = `<div class="queue-stats">
                      <span>Speed: ${job.speed}</span>
                      <span>ETA: ${job.eta}</span>
                  </div>`;
              } else if (job.status === 'completed') {
                  actionHtml = `<a href="/api/download/${job.id}" target="_blank" class="btn btn-success btn-download-item">💾 SAVE TO DEVICE</a>`;
              } else if (job.status === 'error') {
                  statsHtml = `<div style="color:#c0392b; font-weight:bold; font-size:13px;">Error: ${job.error}</div>`;
              }
              
              html += `
              <div class="queue-item">
                  <div class="queue-title">${job.title}</div>
                  <div class="queue-status status-${job.status}">Status: ${job.status} (${job.progress})</div>
                  <div class="queue-progress-bar">
                      <div class="queue-progress-fill" style="width: ${progressNum}%"></div>
                  </div>
                  ${statsHtml}
                  ${actionHtml}
              </div>
              `;
          }
          
          queueContainer.innerHTML = html;
      }

      function startPolling() {
          pollingInterval = setInterval(fetchQueue, 1000);
      }

      // Check on initial load
      fetchQueue();

    </script>
  </body>
</html>

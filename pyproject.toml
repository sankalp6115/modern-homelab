[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "gotify"
version = "0.1.0"
description = "Lightweight Gotify notification client for homelab scripts"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "python-dotenv",
]

[project.scripts]
gotify-cli = "gotify.gotify_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gotify*"]
